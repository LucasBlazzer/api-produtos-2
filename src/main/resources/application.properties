spring.application.name=sistema-produtos-categorias

# Banco H2 em arquivo: os dados permanecem após reiniciar a aplicação.
spring.datasource.url=jdbc:h2:file:./data/produtosdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Console H2 para estudo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-message=always
